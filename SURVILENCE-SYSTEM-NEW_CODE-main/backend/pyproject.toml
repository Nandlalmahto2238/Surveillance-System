[project]
name = "ai-surveillance-backend"
version = "0.1.0"
description = "AI Surveillance System Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.5.2",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.10",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.1",
    "PyJWT>=2.9.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
